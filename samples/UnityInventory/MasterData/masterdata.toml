[project]
id = "sample.unity-inventory"
name = "Unity モデルケース"
version = "0.1.0"

[build]
artifact_dir = ".masterdata/output"
cache = ".masterdata/cache"

[[publish.targets]]
kind = "csharp"
path = "../Unity/Assets/MasterData/Generated"

[[publish.targets]]
kind = "binary"
path = "../Unity/Assets/StreamingAssets/masterdata.bytes"

[build.profiles.production]
exclude_tags = ["debug", "event"]

[build.profiles.development]
exclude_tags = ["event"]

[build.profiles.event]
include_tags = ["common", "event"]

[build.profiles.empty]
include_tags = ["empty-demo"]
